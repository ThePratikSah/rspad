[package]
name = "rspad"
version = "0.1.1"
edition = "2024"
authors = ["Pratik Sah <shivam3448@gmail.com>"]
description = "A fast, offline Rust scratchpad and REPL daemon running locally in your browser"
homepage = "https://rspad.pratik.dev"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThePratikSah/rspad"
readme = "README.md"
keywords = ["scratchpad", "playground", "axum", "repl", "rspad"]
categories = ["development-tools"]

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Link Time Optimization
codegen-units = 1 # Better optimization at the cost of compile time
panic = "abort"   # Remove panic unwinding overhead
strip = true      # Strip symbols and debug info
