<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustPad</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>

<body>

  <header>
    <div class="brand">
      <span>RsPad</span>
    </div>
    <div class="actions">
      <button id="btn-run" class="primary" title="Execute Rust code (⌘+Enter / Ctrl+Enter)">
        <span class="btn-label">Run</span>
      </button>
      <button id="btn-download" class="secondary" title="Download">
        <span class="btn-label">Download</span>
      </button>
      <button id="btn-toggle-terminal" class="secondary" title="Toggle terminal visibility">
        <span id="toggle-terminal-label" class="btn-label">Hide Terminal</span>
      </button>
      <button id="btn-new" title="New boilerplate">
        <span class="btn-label">New Pad</span>
      </button>
    </div>
  </header>

  <div class="workspace dock-right" id="workspace">
    <div class="panel editor-panel" id="editor-panel">
      <div id="editor-container"></div>
    </div>
    <div class="resizer" id="resizer" title="Drag to adjust size (drag to edge to minimize)"></div>
    <div class="panel output-panel" id="output-panel">
      <div class="panel-header">
        <span>Terminal Output</span>
        <div class="panel-header-actions">
          <button id="panel-btn-dock" class="panel-header-btn" title="Toggle dock position">
            <span id="panel-dock-icon-wrapper"></span>
          </button>
          <button id="panel-btn-minimize" class="panel-header-btn" title="Minimize terminal">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
      </div>
      <pre id="output">// Press Run or hit ⌘+Enter to execute.</pre>
    </div>
  </div>

  <footer>
    <div id="status-left">Ready</div>
    <div>by <a href="https://pratik.dev" target="_blank" rel="noopener noreferrer author"
        title="Pratik's Portfolio & Engineering Blog">
        Pratik
      </a></div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
